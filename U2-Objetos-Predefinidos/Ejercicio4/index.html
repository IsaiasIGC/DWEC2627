<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>E4 - Conversor de números</title>
    <link rel="stylesheet" href="style.css">
    <script src="ejercicio4.js" defer></script>
</head>

<body>
    <div class="contenedor">
        <h1>Conversor de decimales</h1>
        <div class="formulario">
            <input type="text" id="numero">

            <button onclick="convertir()">CONVERTIR</button>
        </div>

        <table>
            <tr>
                <td class="tipo">BINARI</td>
                <td class="resultado" id="binario"></td>
            </tr>

            <tr>
                <td class="tipo">OCTAL</td>
                <td class="resultado" id="octal"></td>
            </tr>

            <tr>
                <td class="tipo">HEXADECIMAL</td>
                <td class="resultado" id="hexadecimal"></td>
            </tr>
        </table>

    </div>

</body>
</html>
